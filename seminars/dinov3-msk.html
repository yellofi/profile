>Unable to load this slide. Please refresh the page.</p></figure></main><script>
const slides=[...document.querySelectorAll('.slide')];let current=0;
const prev=document.getElementById('prev'),next=document.getElementById('next');
function update(i){current=i;prev.disabled=i===0;next.disabled=i===slides.length-1;document.getElementById('position').textContent=(i+1)+' / '+slides.length}
function go(i){if(i<0||i>=slides.length)return;update(i);slides[i].scrollIntoView({behavior:'auto',block:'start'});history.replaceState(null,'','#slide-'+(i+1))}
prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
let scheduled=false;window.addEventListener('scroll',()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{const top=document.querySelector('header').getBoundingClientRect().bottom+24;let i=0;slides.forEach((s,j)=>{if(s.getBoundingClientRect().top<=top)i=j});update(i);scheduled=false})},{passive:true});
document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.nextElementSibling.nextElementSibling.hidden=false}));
const initial=/^#slide-(\d+)$/.exec(location.hash);if(initial)go(Number(initial[1])-1);
</script></body></html>
